<section class="panel detail-panel" id="section-detail" aria-labelledby="detail-title" hidden>
  <div class="panel-head"><h2 id="detail-title" tabindex="-1"></h2><span class="unit" id="detail-meta"></span></div>
  <div class="detail-content" id="detail-content"></div>
  <form class="signature-form" id="signature-form" hidden>
    <label>签审图幅 <select id="signature-sheet" name="sheet"></select></label>
    <label>签审员 <input id="reviewer" name="reviewer" required maxlength="30" autocomplete="name"></label>
    <button class="button primary" type="submit">签审入册</button>
    <p class="feedback" id="signature-error" role="alert" hidden></p>
  </form>
  <form class="issuance-form" id="issuance-form" hidden>
    <label>领取单位 <input id="issuance-recipient" name="recipient" maxlength="40" value="分所"></label>
    <label>发放备注 <input id="issuance-note" name="note" maxlength="200" placeholder="可留空"></label>
    <button class="button primary" type="submit">形成发放册</button>
    <p class="feedback" id="issuance-error" role="alert" hidden></p>
  </form>
</section>
